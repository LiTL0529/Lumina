server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Backend API & WebSocket
    location /api/ {
        proxy_pass http://127.0.0.1:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3100/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # C-End Anti-Counterfeiting Verify & Mobile Workbench H5 (Independent Domain Ready)
    location /v/ {
        proxy_pass http://127.0.0.1:5174/v/;
        proxy_set_header Host $host;
    }

    location /m/ {
        proxy_pass http://127.0.0.1:5174/m/;
        proxy_set_header Host $host;
    }

    # PC Admin & Warehouse ERP Console
    location / {
        proxy_pass http://127.0.0.1:5173/;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Backend REST API
    location /api/ {
        proxy_pass http://api:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Realtime Warehouse WebSocket Notifications (Socket.IO)
    location /socket.io/ {
        proxy_pass http://api:3100/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Mobile H5 static assets (distinct /m-assets prefix -> zero clash with web-admin /assets)
    location ^~ /m-assets/ {
        root /usr/share/nginx/miniapp;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # C-End Anti-Counterfeiting Verify (/v and /v/:token)
    location ^~ /v {
        root /usr/share/nginx/miniapp;
        try_files $uri /index.html;
    }

    # B-End Mobile Sales Workbench (/m/workbench)
    location ^~ /m {
        root /usr/share/nginx/miniapp;
        try_files $uri /index.html;
    }

    # PC Admin & Warehouse ERP SPA
    location / {
        root /usr/share/nginx/web-admin;
        try_files $uri $uri/ /index.html;
    }
}
